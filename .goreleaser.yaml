version: 2

project_name: sealway-verifier

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: sealway-verifier
    main: ./apps/cli
    binary: sealway-verifier
    env:
      # The verifier is pure Go on purpose: no cgo keeps cross building simple
      # and keeps a future WebAssembly build possible.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: sealway-verifier
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha512

snapshot:
  version_template: "{{ incpatch .Version }}-next"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  # The release already exists and is what triggered the workflow, so GoReleaser
  # uploads its artifacts onto it rather than creating one of its own.
  mode: append
  prerelease: auto
  footer: |
    ## Verifying a download

    Every archive is listed in `checksums.txt` with its SHA-512 digest, which is
    the same digest the verifier uses for proof files.
