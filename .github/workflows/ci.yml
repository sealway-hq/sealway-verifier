name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The command line interface ships for all three desktop platforms, so
        # all three are exercised.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify the module is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Generated code must be reproducible, so the committed mocks are checked
      # against the interfaces they mock.
      - name: Verify the generated mocks are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run github.com/vektra/mockery/v3@v3.7.3
          git diff --exit-code -- internal/mocks

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Test with coverage
        run: go test -coverpkg=./packages/...,./apps/... -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # A short run on every change keeps the parsers honest without turning the
      # pipeline into a fuzzing campaign.
      - name: Fuzz the untrusted input parsers
        run: |
          for target in \
            FuzzManifestParse \
            FuzzHashUnmarshal \
            FuzzMerkleProofVerify \
            FuzzTimestampParse \
            FuzzBundleOpen \
            FuzzVerifyBundle \
            FuzzVerifyCertificate
          do
            echo "::group::$target"
            go test ./packages/verifier/ -run '^$' -fuzz "^${target}$" -fuzztime 30s
            echo "::endgroup::"
          done

          echo "::group::FuzzVerify (XML signatures)"
          go test ./packages/verifier/trustlist/xmldsig/ -run '^$' -fuzz '^FuzzVerify$' -fuzztime 30s
          echo "::endgroup::"

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Every release target must build without cgo, which is also what keeps a
      # future WebAssembly build possible.
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in \
            darwin/arm64 \
            darwin/amd64 \
            linux/amd64 \
            linux/arm64 \
            windows/amd64
          do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null ./apps/cli
            echo "built $target"
          done

      - name: Build the verification library for WebAssembly
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./packages/...
