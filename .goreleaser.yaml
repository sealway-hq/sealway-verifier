version: 2

project_name: sealway-verifier

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: sealway-verifier
    main: ./apps/cli
    binary: sealway-verifier
    env:
      # The verifier is pure Go on purpose: no cgo keeps cross building simple
      # and keeps a future WebAssembly build possible.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: sealway-verifier
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha512

snapshot:
  version_template: "{{ incpatch .Version }}-next"

sboms:
  - artifacts: archive

# One image per architecture, joined by a manifest below, because a runner
# builds only its own architecture natively and emulating the other is slow and
# occasionally wrong.
dockers:
  - id: amd64
    goarch: amd64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/sealway-hq/sealway-verifier:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=PolyForm-Shield-1.0.0"
      - "--label=org.opencontainers.image.description=Verify a Sealway proof without trusting Sealway"
  - id: arm64
    goarch: arm64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/sealway-hq/sealway-verifier:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=PolyForm-Shield-1.0.0"
      - "--label=org.opencontainers.image.description=Verify a Sealway proof without trusting Sealway"

# Only the version tag is published. A moving "latest" would hand a test suite a
# verifier that changes underneath it, and a verifier changing underneath a test
# suite is exactly what you do not want the day a proof reports differently.
docker_manifests:
  - name_template: "ghcr.io/sealway-hq/sealway-verifier:{{ .Version }}"
    image_templates:
      - "ghcr.io/sealway-hq/sealway-verifier:{{ .Version }}-amd64"
      - "ghcr.io/sealway-hq/sealway-verifier:{{ .Version }}-arm64"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  # The release already exists and is what triggered the workflow, so GoReleaser
  # uploads its artifacts onto it rather than creating one of its own.
  mode: append
  prerelease: auto
  footer: |
    ## Verifying a download

    Every archive is listed in `checksums.txt` with its SHA-512 digest, which is
    the same digest the verifier uses for proof files.
