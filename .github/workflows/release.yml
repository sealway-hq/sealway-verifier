name: Release

# A release is published from the GitHub UI or with `gh release create`. That is
# the only trigger: a tag on its own publishes nothing, so a mistyped or
# throwaway tag can simply be deleted rather than yanked out of two registries
# after the fact.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the command line interface
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is signed with a short lived certificate issued to this run,
      # so the run needs an OIDC identity and somewhere to record the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      # .goreleaser.yaml catalogues an SBOM for every archive, which needs syft
      # on the PATH. Without it the release fails after building everything,
      # which is how this was found: the pipeline had never actually run.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # The release exists already and triggered this run, so GoReleaser
          # uploads onto it instead of creating one.
          args: release --clean
        env:
          # The only credential involved is the token GitHub issues to this run.
          # No Sealway infrastructure is reachable from the release pipeline.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A checksum published in the same release only proves an archive matches
      # what that release says about it. It says nothing about who produced it.
      # A provenance attestation binds each artifact to the workflow, the
      # repository and the commit that built it, and is verifiable by anyone
      # with `gh attestation verify` without trusting this pipeline's output.
      #
      # For a tool whose whole argument is "check this without trusting us",
      # shipping it unattested would be an odd omission.
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

  browser-package:
    name: Publish the browser package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing to GitHub Packages needs nothing but the token this run is
      # issued. A package is private by default whatever the repository's own
      # visibility, and making one public is irreversible.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          check-latest: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@sealway-hq"

      # The module and the Go runtime shim are produced by the same toolchain in
      # the same step, which is what keeps them the matching pair they have to
      # be.
      - name: Assemble the package
        run: make npm-package

      - name: Take the version from the release
        id: version
        working-directory: apps/wasm/npm
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          npm version --no-git-tag-version --allow-same-version "$version"

          # A prerelease goes out under `next`, so `npm install` keeps returning
          # the last stable version to everyone who did not ask for this one.
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac

          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing \`${version}\` under \`${dist_tag}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        working-directory: apps/wasm/npm
        run: npm publish --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
